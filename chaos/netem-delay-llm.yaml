apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: lab-netem-delay-llm
  namespace: slo-loop
spec:
  action: delay
  mode: all
  selector:
    namespaces: [slo-loop]
    labelSelectors:
      app.kubernetes.io/name: llm
  direction: to
  delay:
    latency: "600ms"
    jitter: "50ms"
    correlation: "50"
  duration: "600s"   # safety cap
