[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slo-loop-lab"
version = "0.1.0"
description = "Do classic SRE reliability methods survive LLM-serving workloads? A reproducible laptop lab."
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27,<1",
  "numpy>=1.26",
  "pandas>=2.1",
  "pyyaml>=6",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "fastapi>=0.110,<1",
  "uvicorn>=0.29,<1",
  "prometheus-client>=0.20,<1",
  "yamllint>=1.35",
  "jsonschema>=4",
  "promql-parser>=0.4",
  "kubernetes-validate>=1.30",
  "shellcheck-py>=0.10",
]

[project.scripts]
slo-lab = "lab.cli:main"

[tool.setuptools.packages.find]
include = ["lab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
