{{- if .Values.monitoring.enabled }}
# The Grafana sidecar of kube-prometheus-stack loads every ConfigMap labelled grafana_dashboard=1. One ConfigMap, three
# dashboards (each key becomes a file). The JSON is generated by lab/dashgen.py (`make dashboards-build`); a test fails
# if the committed JSON and the generator disagree.
apiVersion: v1
kind: ConfigMap
metadata:
  name: slo-loop-dashboards
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: slo-loop-lab
data:
  slo-loop-health.json: |-
{{ .Files.Get "dashboards/slo-loop-health.json" | indent 4 }}
  slo-loop-incident.json: |-
{{ .Files.Get "dashboards/slo-loop-incident.json" | indent 4 }}
  slo-loop-autoscaling.json: |-
{{ .Files.Get "dashboards/slo-loop-autoscaling.json" | indent 4 }}
{{- end }}
