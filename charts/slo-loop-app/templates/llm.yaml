{{- include "slo.policyCheck" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm
  labels:
    app.kubernetes.io/name: llm
    {{- include "slo.labels" . | nindent 4 }}
spec:
  {{- if not (include "slo.isKeda" .) }}
  replicas: {{ include "slo.staticReplicas" . }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: llm
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llm
        {{- include "slo.labels" . | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.llm.terminationGraceSeconds }}
      containers:
        - name: llama
          image: {{ include "slo.image" .Values.images.llm | quote }}
          imagePullPolicy: {{ .Values.images.llm.pullPolicy }}
          args:
            - --model
            - {{ printf "/models/%s" .Values.llm.modelFile | quote }}
            - --host
            - "0.0.0.0"
            - --port
            - {{ .Values.llm.port | quote }}
            - --ctx-size
            - {{ .Values.llm.ctxSize | quote }}
            - --parallel
            - {{ .Values.llm.parallel | quote }}
            - --threads
            - {{ .Values.llm.threads | quote }}
            {{- if .Values.llm.metrics }}
            - --metrics
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.llm.port }}
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 3
            failureThreshold: 100
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 3
            failureThreshold: 2
          # Scale-in drain: a terminating pod is removed from the Service at once, but without this hook it receives SIGTERM at once
          # and every stream it is still serving is cut (a failed request = ~1 % of a 110-request run = the whole error budget).
          # `sleep` keeps the pod alive for drainSeconds so in-flight requests finish; terminationGraceSeconds must exceed it.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", {{ .Values.llm.drainSeconds | quote }}]
          # No livenessProbe on purpose: this pod is the experimental subject. A liveness restart under
          # overload would be an uncontrolled fault that confounds every result (startupProbe covers boot).
          resources:
            {{- toYaml .Values.llm.resources | nindent 12 }}
          volumeMounts:
            - {name: models, mountPath: /models, readOnly: true}
      volumes:
        - name: models
          hostPath:
            path: {{ .Values.llm.modelHostPath | quote }}
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: llm
  labels:
    app.kubernetes.io/name: llm
    {{- include "slo.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: llm
  ports:
    - {name: http, port: {{ .Values.llm.port }}, targetPort: http}
