apiVersion: apps/v1
kind: Deployment
metadata:
  name: retriever
  labels:
    app.kubernetes.io/name: retriever
    {{- include "slo.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: retriever
  template:
    metadata:
      labels:
        app.kubernetes.io/name: retriever
        {{- include "slo.labels" . | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: 10
      {{- include "slo.podSecurity" . | nindent 6 }}
      containers:
        - name: retriever
          image: {{ include "slo.image" .Values.images.retriever | quote }}
          imagePullPolicy: {{ .Values.images.retriever.pullPolicy }}
          {{- include "slo.containerSecurity" . | nindent 10 }}
          env:
            - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
          ports:
            - {name: http, containerPort: 8001}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 3
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml .Values.retriever.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: retriever
  labels:
    app.kubernetes.io/name: retriever
    {{- include "slo.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: retriever
  ports:
    - {name: http, port: 8001, targetPort: http}
